name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # The suite redirects storage to a temp dir (see backend/tests/conftest.py),
      # but Settings still requires SECRET_KEY to exist before the app imports.
      SECRET_KEY: ci-only-secret-not-used-anywhere-real
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # PyMuPDF shells out to the Tesseract binary for scanned PDFs. Without it
      # the OCR tests skip rather than fail — install it so they actually run.
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # The ONNX models (int8, ~135 MB) are pinned and checksummed by
      # scripts/fetch_models.py; cached on that file's hash, so the cache is
      # invalidated exactly when a pin changes. Even the fast tier needs the
      # tokenizers, so this runs before any tests.
      - name: Cache ONNX models
        uses: actions/cache@v4
        with:
          path: models
          key: onnx-${{ hashFiles('scripts/fetch_models.py') }}

      - name: Fetch ONNX models
        run: python scripts/fetch_models.py models --precision int8

      # Split so a plain logic break is reported in seconds, without waiting on
      # the model-loading tier — but both tiers must pass.
      - name: Fast tests
        run: pytest -m "not slow"

      - name: Model-backed tests
        run: pytest -m "slow"

      # Cheap and catches a mislabelled eval span, which would otherwise sit
      # there scoring as a permanent miss. Needs no models.
      - name: Validate eval labels
        run: |
          python -m backend.eval --build-corpus
          python -m backend.eval --check

  # The deployed database is Postgres (Neon); local development is SQLite. The
  # two disagree in ways only a real Postgres shows: enforced foreign keys,
  # reserved words (`user`), booleans that will not compare to 1, timestamps
  # converted through the SESSION time zone. The server here deliberately runs
  # a non-UTC zone, so a missing UTC pin shows up as wrong expiries.
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: scholar_test
          TZ: Asia/Kolkata
          PGTZ: Asia/Kolkata
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d scholar_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-not-used-anywhere-real
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/scholar_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Use a non-UTC server time zone
        run: >-
          psql "postgresql://postgres:ci@localhost:5432/scholar_test"
          -c "ALTER DATABASE scholar_test SET timezone TO 'Asia/Kolkata'"

      - name: Cache ONNX models
        uses: actions/cache@v4
        with:
          path: models
          key: onnx-${{ hashFiles('scripts/fetch_models.py') }}

      - name: Fetch ONNX models
        run: python scripts/fetch_models.py models --precision int8

      - name: Tests against Postgres
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # `npm run build` is `tsc -b && vite build` — the type check is the test.
      - run: npm run build
